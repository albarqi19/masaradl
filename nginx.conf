server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # خلف Traefik يصل الطلبُ إلى nginx بـhttp، فيبني تحويلاً مطلقاً بـhttp
    # ⇒ قفزةٌ زائدة لكل تحويل. النسبيُّ يحفظ بروتوكولَ الزائر.
    absolute_redirect off;

    # ترويسات أمان — الموقع ثابت، فلا حاجة لأي إطار خارجي
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml font/woff2;

    # مسارات موقع Wix القديمة — أسماؤها تخالف ملفاتنا، فتُحوَّل ٣٠١
    location = /terms-and-conditions { return 301 /terms; }
    location = /privacy-policy       { return 301 /privacy; }
    location = /projects             { return 301 /team; }
    location = /blank                { return 301 /faq; }

    # ٨١ مقالاً كانت على Wix تحت /post/… ولا مقابل لها بعد.
    # ٣٠١ إلى المدونة أهونُ من ٤٠٤ — يُراجَع حين تُستورد المقالات.
    location ^~ /post/ { return 301 /blog; }

    # صفحةُ الدخول المحلّية أُلغيت — الدخولُ من بوابة النظام مباشرةً،
    # فيرث حمايتَها كاملةً (تحقّقٌ بخطوتين، تحديدُ محاولات، قفلُ حساب).
    location = /login         { return 301 https://app.masaradl.sa; }
    location = /login.html    { return 301 https://app.masaradl.sa; }
    location = /en/login      { return 301 https://app.masaradl.sa; }
    location = /en/login.html { return 301 https://app.masaradl.sa; }

    # أصولٌ مبصومةٌ بالمحتوى فعلياً (صور وخطوط) — كاشٌ طويل
    location ~* \.(webp|png|jpe?g|svg|ico|woff2?|ttf|mp4)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # CSS/JS يتغيّران مع كل دفعة ولا بصمة لهما — كاشٌ قصيرٌ مع إعادة تحقّق
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # الروابطُ النظيفة: /about-us تخدم about-us.html (هكذا فهرستها جوجلُ من Wix)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
